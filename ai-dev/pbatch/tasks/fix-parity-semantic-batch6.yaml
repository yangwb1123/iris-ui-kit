      `onSelectedChange` 的现有回调形状保持。

      测试：Solid 中 single mode 点击/键盘激活同一个 node 两次，第二次后仍选中且
      callback 输出 `[id]`；再覆盖 multi mode 仍可 toggle off。
      完成标准：Solid Tree tests、typecheck、lint 绿。
    provider: openai-codex
    timeout: 5400
    validate: irischeck
