[package]
name = "iris-desktop-tauri"
version = "0.1.0"
edition = "2021"
description = "Tauri desktop shell hosting the Iris UI CMS across React/Vue/Solid/Svelte"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
rust-embed = "8"
mime_guess = "2"

[[bin]]
name = "iris-desktop-tauri"
path = "src/main.rs"

[profile.release]
opt-level = "s"
