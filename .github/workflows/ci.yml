name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build & size budget
        run: pnpm build && node cli.mjs check-size

      - name: Acceptance suite (core gates)
        run: node cli.mjs acceptance

      - name: Full acceptance (advisory — includes tokens/manifest/parity/coverage/exports)
        run: node cli.mjs acceptance --all
        continue-on-error: true

      - name: Manifest up-to-date
        run: pnpm check:manifest

      - name: Size budget
        run: pnpm size

      - name: Token audit
        run: pnpm audit:tokens

      - name: Test coverage report
        run: pnpm test:coverage

      - name: Core instrumented coverage (v8, real thresholds)
        run: pnpm turbo run test:coverage:v8 --filter=@iris-ui-kit/core

      - name: Desktop OS parity
        run: pnpm check:desktop-parity

      - name: RSC directive
        run: pnpm check:rsc


      - name: Test
        run: pnpm test

      - name: E2E smoke (cms-react)
        run: |
          cd apps/cms-react
          npx playwright install --with-deps chrome
          npx playwright test e2e/ --reporter=list

      - name: E2E smoke (cms-vue)
        run: |
          cd apps/cms
          npx playwright install chromium
          npx playwright test e2e/ --reporter=list
        continue-on-error: true

      - name: E2E smoke (cms-solid)
        run: |
          cd apps/cms-solid
          npx playwright install chromium
          npx playwright test e2e/ --reporter=list
        continue-on-error: true

      - name: E2E smoke (cms-svelte)
        run: |
          cd apps/cms-svelte
          npx playwright install chromium
          npx playwright test e2e/ --reporter=list
        continue-on-error: true

      - name: Bench + regression check
        run: |
          pnpm bench
          node scripts/check-bench-regression.mjs