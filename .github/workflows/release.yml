name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Serialize releases so a Version PR and a publish never race.
concurrency: release-${{ github.event.workflow_run.head_branch }}

jobs:
  release:
    # A pull-request CI run must never expose release credentials, and a failed
    # main build must never race ahead into Changesets. Publishing is also
    # default-deny: a maintainer must explicitly set the repository variable
    # IRIS_NPM_RELEASE_ENABLED=true after approving the first release/version.
    if: >-
      vars.IRIS_NPM_RELEASE_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the "Version Packages" PR / push tags
      pull-requests: write
      id-token: write # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (all severities)
        run: |
          pnpm check:brace-expansion-compat
          pnpm audit:security
          pnpm check:brace-expansion-compat

      # CI already passed for this exact immutable SHA. Re-run the compact
      # release-critical surface to defend against packaging/environment drift.
      - name: Verify release candidate
        run: |
          pnpm format:check
          pnpm turbo run test typecheck lint build
          pnpm check:manifest
          pnpm check:docs-reference
          pnpm check:registry
          pnpm audit:tokens
          pnpm size
          pnpm check:rsc
          pnpm check:desktop-parity
          pnpm check:pack-install
          pnpm arch-check:ratchet

      # Opens/updates a "Version Packages" PR when changesets are pending, and
      # publishes to npm once that PR is merged (versions bumped, changelogs
      # written). `release` builds before `changeset publish`.
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm release:publish
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # `changesets publish` invokes npm internally. npm reads this standard
          # config environment variable and emits a Sigstore provenance
          # attestation using the job's OIDC token.
          NPM_CONFIG_PROVENANCE: 'true'
