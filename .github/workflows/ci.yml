name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build & size budget
        run: pnpm build && node cli.mjs check-size

      - name: Acceptance suite (core gates)
        run: node cli.mjs acceptance

      - name: Full acceptance (advisory — includes tokens/manifest/parity/coverage/exports)
        run: node cli.mjs acceptance --all
        continue-on-error: true

      - name: Test
        run: pnpm test

      - name: E2E smoke (cms-react)
        run: |
          cd apps/cms-react
          npx playwright install --with-deps chrome
          npx playwright test e2e/ --reporter=list

      - name: Bench (advisory)
        run: pnpm bench
        continue-on-error: true