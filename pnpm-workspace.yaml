packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  '@parcel/watcher': true
  electron-winstaller: true
  esbuild: true
minimumReleaseAge: 0
overrides:
  # Node20-compatible config backport: bounded picomatch matching replaces
  # the recursive braces implementation. The declared patch changes both loaders.
  '@changesets/config@3.1.4>micromatch': '-'
  'listhen@1.10.1>node-forge': '-'
  '@vinxi/listhen@1.5.6>node-forge': '-'
  # Depth/length guards cover parse and direct AST traversals. The explicit
  # pn.3 tarball's registry signature and GitHub attestation are verified;
  # real discovery/glob regressions must pass, not just the audit package name.
  braces: npm:@dieub/braces-depth-guard@3.0.3-pn.3
  # The legacy Electron downloader only uses bootstrap(); v4 retains that API
  # and removes roarr/sprintf-js. Verify proxy and NO_PROXY behavior before release.
  '@electron/get>global-agent': '4.1.3'
  '@hono/node-server@>=2.0.0 <=2.0.9': '>=2.0.10'
  '@modelcontextprotocol/sdk@>=1.12.0 <1.31.0': '1.31.0'
  '@nuxt/devtools': '3.3.1'
  # All X509 classes and their decorators must share the same schema storage.
  '@peculiar/x509>@peculiar/asn1-schema': '2.10.0'
  '@simple-git/argv-parser@<2.0.1': '2.0.1'
  '@sveltejs/kit': '2.70.2'
  '@vue/server-renderer': '3.5.42'
  '@xmldom/xmldom@^0.8.0': '0.8.15'
  '@xmldom/xmldom@^0.9.0': '0.9.12'
  'baseline-browser-mapping@<2.11.0': '2.11.12'
  'brace-expansion': '5.0.12'
  'browserslist@<4.28.7': '4.28.7'
  'cookie': '0.7.2'
  'devalue@<5.9.3': '5.9.3'
  # Keep the declared Electron 42 line; an unbounded range pulled vulnerable 43.
  'electron@>=42.0.0-alpha.1 <42.5.1': '42.11.11'
  'esbuild': '0.25.0'
  'fast-uri': '3.1.8'
  'h3': '1.15.11'
  'hono': '4.13.7'
  'http-cache-semantics@<=4.2.0': '4.3.0'
  'ip-address': '10.7.1'
  'js-yaml@>=3.0.0 <4.0.0': '3.15.2'
  'js-yaml@>=4.0.0 <4.3.1': '>=4.3.1'
  'js-yaml@>=5.0.0 <=5.4.0': '5.4.2'
  'minimatch': '^10.0.0'
  'nanoid@>=4.0.0 <5.1.16': '>=5.1.16'
  'next': '15.5.27'
  'nuxt': '3.21.11'
  'postcss': '8.5.23'
  'postcss-selector-parser@<7.1.6': '7.1.6'
  'proxy-addr@>=1.1.0 <2.0.8': '2.0.8'
  'qs@<6.16.0': '6.16.0'
  # Retain ManyPkg v1's root API. The YAML reader's v2 keeps async/sync reads
  # but uses js-yaml 4, removing argparse 1/sprintf-js from workspace discovery.
  'read-yaml-file@^1.1.0': '2.1.0'
  'seroval@>=0.12.0 <=1.6.2': '1.6.3'
  'sharp': '0.35.5'
  'shell-quote@>=1.8.4 <1.11.0': '1.11.0'
  # v4 closes the unsafe-operation bypass; Nuxt devtools integration must be tested.
  'simple-git@>=3.15.0 <4.0.1': '4.0.1'
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'
  'svelte-eslint-parser': '1.8.0'
  'svgo@<4.1.0': '4.1.0'
  'tsup': '8.5.0'
  'typescript': '5.9.3'
  'undici': '7.29.1'
  'vinxi': '0.5.11'
  'vite': '6.4.3'
  'vitepress': '1.6.4'
  'vue': '3.5.42'
packageExtensions:
  '@changesets/config@3.1.4':
    dependencies:
      picomatch: '4.0.7'
  'listhen@1.10.1':
    dependencies:
      '@iris-ui-kit/dev-certificate': 'workspace:*'
  '@vinxi/listhen@1.5.6':
    dependencies:
      '@iris-ui-kit/dev-certificate': 'workspace:*'
patchedDependencies:
  '@changesets/config@3.1.4': patches/@changesets__config@3.1.4.patch
  'listhen@1.10.1': patches/listhen@1.10.1.patch
  '@vinxi/listhen@1.5.6': patches/@vinxi__listhen@1.5.6.patch
