# pbatch 批次：Table current-row 能力补齐 + RTL/减动效收尾（第四批）
#
# 来源：docs/auto/reviews/parity-semantic.md 的 P0-1（Table current-row 只有
# React 有）与 token-discipline.md 的 P1-6（子菜单 RTL 键盘/定位）、P2-14
# （Marquee 只在初始化时读一次 prefers-reduced-motion）。
#
# 契约以 React 的现有实现为准（vxe row-config.isCurrent parity），三端补齐时
# 必须同名同语义，不改名、不改默认值。
#
# 串行执行：任务改同一棵树。
#
# 运行：
#   python3 -m pbatch ai-dev/pbatch/tasks/fix-table-rtl-batch4.yaml --retries 2
#
# ⚠️ 任务文件是受保护输入：任何任务都不得修改 ai-dev/**、docs/**、scripts/**、
#    CI 配置或其它组件。交付物写在最终回复里，不要自己写文件。

tasks:
  # ── 1. Table current-row：Vue 补齐 ───────────────────────────────────
  - prompt: |
      硬约束：只改本任务点名的文件；不要新建脚本或改 ai-dev/**、docs/**、
      scripts/**、CI 配置；不要设计额外工作流；最终回复里给总结，不要自己写文件。

      你是 iris-ui 的 Vue 适配器维护者。仓库根 = 当前目录，先读 AGENTS.md。

      缺陷（已核实）：`IrisTable` 的“当前行”能力只有 React 有——
      `packages/react/src/primitives/table/props/layout.ts:48-52` 声明
      `currentRowKey` / `onCurrentRowChange` / `beforeCurrentRowChange`
      （vxe `row-config.isCurrent` parity），`Table.tsx:6361` 渲染
      `data-iris-row-current`。Vue 只有 `rowClick`（`props.ts:186-187`），
      行渲染（`table-body-row.ts:414-419`）没有任何 current 标记。
      后果：同一个表格，Vue 端无法受控高亮当前行，也无法监听/否决变更。

      任务：按 React 的契约在 Vue 端补齐这三个能力：
      - 三个 prop **同名同类型**（`currentRowKey?: string | number`、
        `onCurrentRowChange?: (key, row) => void`、
        `beforeCurrentRowChange?: (key, row) => boolean | void`），默认值与
        React 一致（`currentRowKey` 无默认、不受控时点击不改变高亮之外的任何
        行为）；如果 Vue 端用 `v-model` 风格更自然，仍必须保留这三个名字。
      - 行渲染输出 `data-iris-row-current="true"`（与 React 完全相同的属性名
        与值），样式与 React 的 current 行样式保持一致。
      - 点击行时：先询问 `beforeCurrentRowChange`，返回 false 则不切换；否则触发
        `onCurrentRowChange`（受控场景由父组件决定最终高亮）。
      - 先读 React 的实现（`Table.tsx:6361` 附近与 core 里的相关实现），尽量复用
        已有纯函数，不要在 Vue 里重推一份判定逻辑。

      约束：只改 vue 的 table（props 契约 + 行渲染 + 事件接线 + 测试）。
      不要顺手改 Table 其它特性。补测试：受控切换、回调触发、
      `beforeCurrentRowChange` 返回 false 时不切换、`data-iris-row-current`
      属性与值与 React 一致。
      完成标准：vue table 测试全绿、typecheck 无错、`pnpm check:parity` 不回退
      （`IrisTable` 的 prop 共有率应当上升）。
    provider: openai-codex
    timeout: 5400
    validate: irischeck
    output: docs/auto/reviews/batch4-vue-table-current-row.md

