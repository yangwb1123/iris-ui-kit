name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Publication, version preparation, and application upgrades are separate.
# Never automatically replay a failed/unknown release. Inspect its receipt first.
concurrency: release-${{ github.event.workflow_run.head_branch }}

jobs:
  release:
    # Explicitly approve this exact versioned SHA and source digest only after
    # qualification. A new main push, PR CI, or a failed run grants no release.
    if: >-
      vars.IRIS_NPM_RELEASE_ENABLED == 'true' &&
      vars.IRIS_APPROVED_RELEASE_SHA == github.event.workflow_run.head_sha &&
      vars.IRIS_APPROVED_SOURCE_SHA256 != '' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Create-only per-package/version intent refs fence fresh-worker retries.
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Checkout approved immutable source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install the locked browser launcher and native Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
        env:
          CI: '1'
          HUSKY: '0'

      # This standalone publisher freezes clean source, installs/builds/tests in
      # a private stage, validates all 27 actual tarballs before ANY write, checks
      # all immutable registry versions, and reconciles every write outcome.
      # It never bumps versions, restores source, commits, pushes, or upgrades apps.
      - name: Qualify and publish the exact whole graph with provenance
        run: >-
          python3 -B scripts/release/iris_publish.py --publish
          --iris-ui-dir "$GITHUB_WORKSPACE"
          --output-dir "$RUNNER_TEMP/iris-publication"
          --expected-head "$APPROVED_RELEASE_SHA"
          --expected-source-sha256 "$APPROVED_SOURCE_SHA256"
          --ci-run-id "$QUALIFIED_CI_RUN_ID"
        env:
          CI: '1'
          HUSKY: '0'
          PYTHONDONTWRITEBYTECODE: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          NUXT_TELEMETRY_DISABLED: '1'
          IRIS_NPM_RELEASE_ENABLED: ${{ vars.IRIS_NPM_RELEASE_ENABLED }}
          APPROVED_RELEASE_SHA: ${{ vars.IRIS_APPROVED_RELEASE_SHA }}
          APPROVED_SOURCE_SHA256: ${{ vars.IRIS_APPROVED_SOURCE_SHA256 }}
          QUALIFIED_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Preserve partial or unknown publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-publication-${{ github.event.workflow_run.head_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iris-publication
          if-no-files-found: warn
          retention-days: 14
