name: Release

on:
  push:
    branches: [main]

# Serialize releases so a Version PR and a publish never race.
concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the "Version Packages" PR / push tags
      pull-requests: write
      id-token: write # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first for accurate size/manifest checks
      - name: Build
        run: pnpm build

      # Pre-release quality gates — ensure nothing broken before publishing
      - name: Pre-release checks
        run: |
          node cli.mjs acceptance --all
          node cli.mjs check-size
          node cli.mjs check-manifest

      # Opens/updates a "Version Packages" PR when changesets are pending, and
      # publishes to npm once that PR is merged (versions bumped, changelogs
      # written). `release` builds before `changeset publish`.
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm release
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
