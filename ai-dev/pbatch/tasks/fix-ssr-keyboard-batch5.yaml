  # ── 6. Resizable 拖拽手柄的语义（四端对齐 Svelte）────────────────────
  - prompt: |
      硬约束：只改本任务点名的文件；不要新建脚本或改 ai-dev/**、docs/**、
      scripts/**、CI 配置；不要启动任何 batch runner；最终回复里给总结，不要写文件。

      你是 iris-ui 的 React / Vue / Solid 适配器维护者。仓库根 = 当前目录，
      先读 AGENTS.md。

      缺陷（已核实）：Resizable/Resizer 的拖拽手柄在 react/vue/solid 是一个空
      `<div>`，没有 role、没有可访问名称、不可聚焦、不能用键盘调整
      （react `packages/react/src/behaviors/Resizable.tsx:95-125`）；Svelte 用
      `<button>` 并接了 `resizer.handle` 文案与键盘。
      后果：键盘用户无法调整面板尺寸，屏幕阅读器把拖拽条当装饰。

      任务：让三端与 Svelte 对齐：
      - 手柄改为可聚焦的交互元素（沿用 Svelte 的按钮方案；或
        `role="separator"` + tabIndex，两者选其一并四端统一）；
      - 提供可本地化名称（复用既有 `resizer.*` key；需新增则 core 两份
        消息同步）；
      - 键盘调整：方向键按 step 调整，Home/End 到边界（若 Svelte 已有则照搬
        语义与步长）；
      - 保持现有 pointer 拖拽行为与 disabled 语义不变。

      约束：只改三端 resizable/resizer + 测试（i18n key 若新增需两份同步）。
      补测试：三端各一条——手柄可聚焦且有可访问名称、方向键调整尺寸、
      现有 pointer 拖拽不回归。
      完成标准：三端 behaviors 测试绿、typecheck 绿、locale-zh 测试绿。
    provider: openai-codex
    timeout: 5400
    validate: irischeck
    output: docs/auto/reviews/batch5-resizable-keyboard.md
