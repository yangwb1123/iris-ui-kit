name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (all severities)
        run: |
          pnpm check:brace-expansion-compat
          pnpm audit:security
          pnpm check:brace-expansion-compat

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Pack + external npm install smoke check
        run: pnpm check:pack-install

      - name: Acceptance suite (core gates)
        run: node cli.mjs acceptance

      - name: Manifest up-to-date
        run: pnpm check:manifest

      - name: Generated docs reference up-to-date
        run: pnpm check:docs-reference

      - name: Registry templates
        run: pnpm check:registry

      - name: Size budget
        run: pnpm size

      - name: Token audit
        run: pnpm audit:tokens

      - name: Test coverage report
        run: pnpm test:coverage

      - name: Core instrumented coverage (v8, real thresholds)
        run: pnpm turbo run test:coverage:v8 --filter=@iris-ui-kit/core

      - name: Desktop OS parity
        run: pnpm check:desktop-parity

      - name: RSC directive
        run: pnpm check:rsc


      - name: Test
        run: pnpm test

      - name: Browser E2E (four CMS frameworks) + visual regression
        run: |
          cd apps/cms-react
          npx playwright install --with-deps chrome
          npx playwright test

      - name: Bench + regression check
        run: |
          pnpm bench
          node scripts/check-bench-regression.mjs

      - name: Change budget (advisory)
        run: pnpm change-budget
        continue-on-error: true

  native-linux:
    name: Native Linux shells (no skips)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IRIS_REQUIRE_NATIVE_BUILD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: apps/desktop-wails/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build four CMS renderers
        run: pnpm turbo run build --filter=cms --filter=cms-react --filter=cms-solid --filter=cms-svelte

      - name: Build and test Electron, Tauri, and Wails
        run: |
          pnpm --filter iris-desktop build
          pnpm --filter iris-desktop test
          pnpm --filter iris-desktop-tauri build
          pnpm --filter iris-desktop-tauri test
          pnpm --filter iris-desktop-wails build
          pnpm --filter iris-desktop-wails test
