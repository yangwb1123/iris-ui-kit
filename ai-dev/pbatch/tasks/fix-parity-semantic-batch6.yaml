  # ── 4. Tree 四端统一 core data-state + stale-while-revalidate ─────────
  - prompt: |
      硬约束：只改 React / Solid / Svelte Tree 实现与测试；Vue 是正确基线，只读
      参考、不修改；不要改 ai-dev/**、docs/**（output 除外）、scripts/**、CI；
      不要启动 batch runner；不要 git add / commit。

      先读 AGENTS.md、`packages/core/src/data-state.ts`、parity review finding #6，
      再比对 `packages/vue/src/primitives/tree/Tree.ts`。

      缺陷：React Tree 未给 `resolveDataState` 传 `hasContent`；Solid/Svelte 自己
      写 top-level state 分支，导致已有 nodes 正在刷新时被 loading/error 节点替换，
      且各端 precedence 有漂移。Core 的语义：无 content 时 `error > loading >
      empty > content`；若 `loading && hasContent`，保留内容，返回 content
      （stale-while-revalidate，抑制旧 error/loading 覆盖已有数据）。Vue 已通过
      `useDataState(...hasContent)` 接此行为。

      任务：
      - React 传 `hasContent: safeNodes.length > 0` 给共享 useDataState；
      - Solid/Svelte 使用同一 core `resolveDataState` / 现有共享桥，不再复制 precedence；
      - content 状态始终渲染树；只有 resolved state 为 error/loading/empty 时渲染状态节点；
      - `aria-busy` 维持统一约定（可在背景 revalidate 时反映 `loading`，但不得隐藏节点）；
      - 保持 lazy-child loading/error per-node 状态与 top-level state 区分。

      三端测试矩阵：
      1) 空 nodes + loading -> loading；
      2) 空 nodes + loading + error -> error；
      3) 已有 node + loading -> node 保留、无 top-level loading replacement；
      4) 已有 node + loading + error -> 按 core SWR 保留 nodes；
      5) 空 nodes 无 loading/error -> empty。
      完成标准：三端 Tree tests、typecheck、lint 绿；Vue 测试基线不回归。
    provider: openai-codex
    timeout: 5400
    validate: irischeck
    output: docs/auto/reviews/batch6-tree-data-state.md

  # ── 5. Vue List 增加受控 / 非受控双模 ────────────────────────────────
  - prompt: |
      硬约束：只改 Vue List 源码与测试；不要改 ai-dev/**、docs/**（output 除外）、
      scripts/**、CI；不要启动 runner；不要 git add / commit。

      先读 AGENTS.md 和 parity review finding #9，再对照 React/Solid List API。
      Vue `packages/vue/src/primitives/list/List.ts` 目前只有 `modelValue`，render
      selection 完全依赖 props；不传 `v-model` 时 select event 发出但
      `aria-selected` 永远不变。React/Solid 有 internal selection + defaultValue。

      任务：实现 Vue `IrisList` 的 controlled/uncontrolled 双模：
      - 添加可选 `defaultValue`，支持单值与 multi 数组；
      - `modelValue !== undefined` 时为 controlled，只 emit，不本地覆盖；
      - 未传 modelValue 时用 internal ref 更新，立即反映 aria-selected/renderItem/slot 的
        selected 状态；
      - controlled prop 后续更新同步显示；multi toggle 从当前有效值计算；
      - 保持现有 update:modelValue/select 事件、disabled、keyboard 与数据状态语义。

      测试：无 modelValue 点击后选中；defaultValue 起始值；multi uncontrolled toggle；
      controlled parent 更新；controlled 点击只 emit 且保持传入值。
      完成标准：Vue List tests、typecheck、lint 绿。
    provider: openai-codex
    timeout: 5400
    validate: irischeck
    output: docs/auto/reviews/batch6-vue-list-uncontrolled.md
