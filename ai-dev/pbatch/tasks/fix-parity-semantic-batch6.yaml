tasks:
  # ── 1. Portaled submenu 外部点击不能误关闭 root menu ───────────────────
  - prompt: |
      硬约束：只修改本任务点名的 React / Solid / Svelte menu context、content、
      submenu 与对应测试；不要改 Vue（它已经有正确实现，可作参考）；不要改
      ai-dev/**、docs/**、scripts/**、CI 配置；不要启动任何 batch runner；
      不要 git add / commit。

      先读 AGENTS.md，再阅读 `docs/auto/reviews/parity-semantic.md` 的 finding #2，
      并逐行对照 Vue 实现：
      - `packages/vue/src/primitives/menu/MenuContent.ts` 用 `excludePredicate`
        判断 `target.closest([data-iris-menu-tree="<treeId>"])`；
      - `packages/vue/src/primitives/menu/MenuSub.ts` 给 root/submenu portaled 内容
        标记相同 tree id。

      缺陷：React / Solid / Svelte 的 `useDismiss` 只排除了当前 trigger/content
      ref。submenu content portal 到 body 后，点击其中的 item 被误判为 root menu
      outside pointerdown，导致整个菜单树关闭。Vue 已正确解决。

      任务：把 Vue 的 tree-exclusion 语义薄桥到 React / Solid / Svelte：
      - 每个 root menu 建立一个稳定的 tree id，并通过 submenu context 继承；
        React 用 framework `useId` / 现有 root id，Solid 用 `createUniqueId` 或
        现有稳定 id，Svelte 用 `$props.id()` 或现有 component id；勿用模块计数器；
      - root content 与每个 portal submenu content 都带
        `data-iris-menu-tree="<same tree id>"`；
      - root 与 nested `useDismiss` 均用 predicate 排除同一树内的 target，覆盖
        SVG 子节点（使用 `Element.closest`，不要只做 HTMLElement 检查）；
      - 真正点击菜单树外仍关闭 root；Escape/Tab/现有 focus 行为不变。

      必须补回归测试：React/Solid/Svelte 各自打开至少一层 portal submenu，
      pointerdown submenu 内容后 root 仍 open；再点树外后 root 关闭。测试应触发
      真实 dismiss 监听，不要只断言 data attribute 存在。
      完成标准：三端 menu 测试、typecheck、lint 绿；无新的 hard-coded style。
    provider: openai-codex
    timeout: 5400
    validate: irischeck
    output: docs/auto/reviews/batch6-menu-portal-dismiss.md

  # ── 2. Svelte ColorPicker 初始化 / 外部同步不可触发 onValueChange ─────
  - prompt: |
      硬约束：只改本任务点名的 Svelte ColorPicker 与测试；不要改 ai-dev/**、
      docs/**（输出路径由 pbatch 管理）、scripts/**、CI；不要启动 batch runner；
      不要 git add / commit。

      先读 AGENTS.md，再读 parity review finding #4。
      `packages/svelte/src/primitives/color-picker/IrisColorPicker.svelte` 当前
      reactive effect 同时负责由 HSVA 同步 hex input 与 `onValueChange`；因此
      mount/受控 value 更新也会回调。React 的对应实现只在用户 commit 中回调。
      测试在 mount 后 `mockClear()` 掩盖了这个差异。

      任务：分离“外部 prop → 内部显示状态同步”和“用户输入 → commit”：
      - mount、受控 `value` 更新只同步 HSVA / hex draft，不调用 onValueChange；
      - pointer、键盘、有效 hex 输入、preset 等用户交互每次只调用一次；
      - 不完整 hex draft 不触发回调；禁用态不 commit；保留现有回调格式/颜色归一化
        与 alpha/颜色计算行为。
      - 避免用一次性 `didMount` 标志掩盖受控 prop 更新；优先在交互事件路径显式
        调用 commit，再让 `$effect` 只做 prop 同步。

      测试：删除 mount 后清空 spy 的掩盖；断言 mount 时 0 次，受控 prop 更新时
      0 次，pointer/hex/preset 用户动作各恰好一次，坏输入 0 次。
      完成标准：Svelte ColorPicker tests + svelte-check + lint 绿。
    provider: openai-codex
    timeout: 5400
    validate: irischeck
    output: docs/auto/reviews/batch6-svelte-colorpicker-init.md

  # ── 3. Solid Tree single-select 不应再次点击就取消选择 ────────────────
  - prompt: |
      硬约束：只改 Solid Tree 实现与测试；不要改 ai-dev/**、docs/**（output 除外）、
      scripts/**、CI；不要启动 runner；不要 git add / commit。

      先读 AGENTS.md 和 parity review finding #5。React/Vue/Svelte 的 single mode
      再次激活当前选中 node 仍保留它；Solid 当前 `selectNode` 在 single mode
      toggle 当前 id，所以会把 selected node 清空。

      任务：Solid `selectionMode='single'` 用同一语义——设置 `[id]`，重复激活不
