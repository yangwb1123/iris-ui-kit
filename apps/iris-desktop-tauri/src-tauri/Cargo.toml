[package]
name = "desktop-os-tauri"
version = "0.1.0"
description = "Iris Desktop OS — Native Tauri Build"
authors = ["Iris UI Team"]
edition = "2021"

[lib]
name = "desktop_os_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
