tasks:
  # ── 1. Svelte 用 $props.id() 取代进程级自增 id（AGENTS 明令禁止）──────
  - prompt: |
      硬约束：只改本任务点名的文件；不要新建脚本或改 ai-dev/**、docs/**、
      scripts/**、CI 配置；不要设计额外工作流；**不要启动任何 batch runner**；
      最终回复里给总结，不要自己写文件。

      你是 iris-ui 的 Svelte 适配器维护者。仓库根 = 当前目录，先读 AGENTS.md
      （其中明确写着「SSR 稳定 id：框架原生 useId，**勿用模块自增计数器**」）。

      缺陷（已核实）：`@iris-ui-kit/core` 的 `generateId()`
      （`packages/core/src/utils.ts:26`）是**进程级**单调计数器，而 Svelte 端
      多个组件在初始化阶段调用它来生成 ARIA 关联 id，例如
      `packages/svelte/src/primitives/form-field/FormField.svelte:19-22`、
      `dropdown/Dropdown.svelte:39`、`drawer/IrisDrawer.svelte:51`、
      `tooltip/IrisTooltip.svelte:39`、`accordion/IrisAccordion.svelte:31`、
      `radio/IrisRadioGroup.svelte:26`、`cascader/IrisCascader.svelte:88`、
      `mentions/IrisMentions.svelte:66`、`tree-select/IrisTreeSelect.svelte:41`。
      后果：长驻 SSR 进程处理第二个请求时，服务端已输出 `iris-20`，而浏览器
      从 `iris-1` 开始 hydration，`for` / `aria-describedby` / `aria-controls`
      全部错位。`packages/svelte/src/hydration.test.ts:45-54` 甚至把这个计数器
      的漂移写进了注释当作已知情况。

      任务：改用 Svelte 5 的原生稳定 id —— `$props.id()`（本仓库已有一个组件
      这么用：`packages/svelte/src/primitives/icon/IrisIconPicker.svelte:46`，
      依赖是 svelte ^5.16，装的是 5.56）。要求：
      - 逐个替换上述组件里的 `generateId()`，保留原有 id 派生结构
        （例如 `${id}-panel`、`${id}-hint`）；
      - 仍需保留消费方显式传入 id 的入口（若原本支持 prop id，就让显式 id 优先）；
      - 不要再引入新的模块级计数器；
      - 更新 `packages/svelte/src/hydration.test.ts` 的注释与断言：现在 id 是
        确定性的，**不应再**需要把 `iris-\d+` 归一化后才能比较；如果该归一化是
        因为别的原因才存在，保留但改注释说明。

      补测试：连续两次 SSR 渲染同一棵树，断言输出的 id 逐字节一致（不再依赖
      计数器），并保留“ARIA 引用指向同一份输出里真实存在的元素”的断言。
      完成标准：svelte 全部测试 + hydration 测试全绿，`svelte-check` 0 错误，
      typecheck 无错。
      provider: openai-codex
      timeout: 5400
      validate: irischeck
      output: docs/auto/reviews/batch5-svelte-stable-ids.md

  # ── 2. 资源控制器不要在构造期发请求 ─────────────────────────────────
  - prompt: |
      硬约束：只改本任务点名的文件；不要新建脚本或改 ai-dev/**、docs/**、
      scripts/**、CI 配置；不要设计额外工作流；**不要启动任何 batch runner**；
      最终回复里给总结，不要自己写文件。

      你是 iris-ui 的 core + 适配器维护者。仓库根 = 当前目录，先读 AGENTS.md。

      缺陷（已核实）：`createResourceController` 的 `immediate` 默认开启
      （`packages/core/src/resource.ts:32-38,160`），构造时立即 `load()`；
      而 plugin-admin 的 controller 没关掉它
      （`packages/plugin-admin/src/core/controller.ts:188`），四个 Admin DataPage
      又都在 render/setup 阶段创建 controller（react
      `packages/plugin-admin/src/react/DataPage.tsx:28`、vue
      `src/vue/DataPage.ts:48`、solid `src/solid/DataPage.tsx:62`、svelte
      `src/svelte/DataPage.svelte:31`）。Solid/Svelte 的 `useResourceController`
      还直接把 config 透传（`packages/{solid,svelte}/src/resource/useResourceController.ts:25`），
      React/Vue 则显式关掉了 immediate。
      后果：SSR 或 React 中断/StrictMode 首次渲染时就会发请求，SSR 阶段根本没有
      cleanup 可言。

      任务：把“构造不发请求、挂载后加载”做成一致契约：
      - plugin-admin 的 controller 显式 `immediate: false`，由四端 DataPage 在
        挂载时（`useEffect` / `onMounted` / `onMount`）触发首次加载；
      - Solid/Svelte 的 `useResourceController` 行为与 React/Vue 对齐
        （若它本来就该立即加载，说明理由并保持一致，不要造出第四种语义）；
      - 组件卸载时必须 `destroy()`，避免晚到响应写入已卸载的 store；
      - 保持 server-mode（消费方自带 `load`）的既有行为不变。

      补测试：SSR 渲染 Admin DataPage 时断言 fetcher 调用次数为 0；挂载后恰好
      一次；卸载后晚到响应不写回。
      完成标准：plugin-admin 四端测试全绿、core 测试全绿、typecheck 无错。
      provider: openai-codex
      timeout: 5400
      validate: irischeck
      output: docs/auto/reviews/batch5-resource-immediate.md

  # ── 3. ProTable store 补 destroy() ──────────────────────────────────
  - prompt: |
      硬约束：只改本任务点名的文件；不要新建脚本或改 ai-dev/**、docs/**、
      scripts/**、CI 配置；不要设计额外工作流；**不要启动任何 batch runner**；
      最终回复里给总结，不要自己写文件。

      你是 iris-ui 的 plugin-pro-table 维护者。仓库根 = 当前目录，先读 AGENTS.md
      （core 是复用逻辑之家；订阅必须可清理）。

      缺陷（已核实）：`ProTableStore` 接口没有 `destroy()`
      （`packages/plugin-pro-table/src/core/types.ts:163`），而构造期注册的
      订阅（`store-engine.ts:136` 的 `expansion.store.subscribe`、
      `:143` 的 `dataSource.subscribe`、`:204` 的 `cellEdit.store.subscribe`、
      `:224` 的本地 store 订阅）**都没有保存 unsubscribe**；底层 `dataSource`
      虽然有 `destroy()`，但没被暴露也没被调用；构造时还会立即加载
      （`store-engine.ts:278`）。
      后果：反复创建/卸载 server-mode ProTable 时，慢请求完成后仍会触发旧 store
      的回调，订阅闭包持续保留（真实泄漏）。

      任务：
      - 给 `ProTableStore` 增加幂等的 `destroy()`，用 core 现成的
        `createDisposableScope` 统一管理所有订阅、请求与子控制器；
      - 四端 adapter（react/vue/solid/svelte）在组件卸载时调用它；
      - `destroy()` 后不得再有内部回调触发，也不得再发请求；
      - 不改对外的 props/事件契约。

      补测试：创建 → destroy → 断言所有内部订阅不再收到事件、请求被取消；
      重复调用 `destroy()` 不抛错。
      完成标准：plugin-pro-table 四端测试全绿、typecheck/svelte-check 无错。
      provider: openai-codex
      timeout: 5400
      validate: irischeck
      output: docs/auto/reviews/batch5-protable-destroy.md

  # ── 4. FormField 把 required 传给控件（aria-required）───────────────
  - prompt: |
      硬约束：只改本任务点名的文件；不要新建脚本或改 ai-dev/**、docs/**、
      scripts/**、CI 配置；不要设计额外工作流；**不要启动任何 batch runner**；
      最终回复里给总结，不要自己写文件。

      你是 iris-ui 的四适配器维护者。仓库根 = 当前目录，先读 AGENTS.md。

      缺陷（已核实）：四端的 `IrisFormField` 在 `required` 时只渲染一个视觉星号
      （例：react `packages/react/src/primitives/form-field/FormField.tsx:90-96`），
      既不向被包裹的控件注入 `required`，也不设 `aria-required`。
      后果：屏幕阅读器完全不知道该字段必填——星号是纯视觉的。

      任务：四端统一在 `required` 时给控件加 `aria-required="true"`
      （原生控件若是 `input`/`select`/`textarea`，可同时设置 `required` 属性；
      若控件自带 `required`/消费方已设置，不要覆盖）。要求：
      - 四端语义一致：不传 `required` 时不得出现该属性；
      - 保持现有的星号渲染与校验逻辑不变；
      - 如果消费方显式关闭了 `required`，以消费方为准。

      补测试：四端各一条，断言 `required` 时控件带 `aria-required="true"`，
      不传时没有。
      完成标准：四端 form-field 测试全绿、typecheck/svelte-check 无错、
      `pnpm check:parity` 不回退。
      provider: openai-codex
      timeout: 5400
      validate: irischeck
      output: docs/auto/reviews/batch5-formfield-required.md

  # ── 5. Cascader 选项的键盘可达性（React/Vue/Solid 补 Svelte 已有的）────
  - prompt: |
      硬约束：只改本任务点名的文件；不要新建脚本或改 ai-dev/**、docs/**、
      scripts/**、CI 配置；不要设计额外工作流；**不要启动任何 batch runner**；
      最终回复里给总结，不要自己写文件。

      你是 iris-ui 的 React / Vue / Solid 适配器维护者。仓库根 = 当前目录，
      先读 AGENTS.md。

      缺陷（已核实）：Cascader 的选项在三端是**鼠标专用**——有 `role="option"`，
      但既没有 `tabIndex`，也没有键盘激活（例：react
      `packages/react/src/primitives/cascader/Cascader.tsx:166-172`）；列容器也
      缺少 Svelte 端已有的 `cascader.level` 文案。Svelte 端已经实现了键盘路径。
      后果：键盘用户完全无法操作级联选择（WCAG 2.1.1）。

      任务：把键盘能力补到三端，语义与 Svelte 端一致：
      - 列表（role="listbox"）可聚焦，选项用 roving tabindex 或
        `aria-activedescendant`（沿用仓库既有做法，参考 core 的
        `nextEnabledIndex` / `createSelectionModel`）；
      - ArrowUp/Down 移动、Home/End 跳首尾、Enter/Space 选中、Esc 关闭；
      - 每列用 `t('cascader.level', …)` 之类的既有 key 作为可访问名称（若该 key
        不存在，就在 core 的 i18n 里加，并同步补 `plugin-locale-zh` 的中文——
        locale-zh 有“每个内置 key 都必须有中文”的回归，别漏）；
      - 不改鼠标行为，不改 DOM 钩子名。

      补测试：三端各至少两条（键盘移动 + 键盘选中），并断言可访问名称。
      完成标准：react/vue/solid 的 cascader 测试全绿、typecheck 无错、
      `pnpm audit:tokens` 与 `pnpm check:parity` 不回退。
      provider: openai-codex
      timeout: 5400
      validate: irischeck
      output: docs/auto/reviews/batch5-cascader-keyboard.md

  # ── 6. Splitter / Resizer 的键盘可达性与可访问名称 ───────────────────
  - prompt: |
      硬约束：只改本任务点名的文件；不要新建脚本或改 ai-dev/**、docs/**、
      scripts/**、CI 配置；不要设计额外工作流；**不要启动任何 batch runner**；
      最终回复里给总结，不要自己写文件。

      你是 iris-ui 的 React / Vue / Solid 适配器维护者。仓库根 = 当前目录，
      先读 AGENTS.md。

      缺陷（已核实，两个组件）：
      - `IrisSplitter` 的 separator 有 `tabIndex` 却没有 keydown 处理，也没有
        可本地化名称（react
        `packages/react/src/primitives/splitter/Splitter.tsx:112-125`；
        vue/solid 同）；Svelte 已实现方向键与 `splitter.resize` 文案。
      - `Resizable` 的拖拽手柄是**空 `<div>`**（react
        `packages/react/src/behaviors/Resizable.tsx:95-125`；vue/solid 同），
        没有 role/名称/焦点/键盘调整；Svelte 用真正的 `<button>` 并复用
        `resizer.handle` 文案。
      后果：键盘用户无法调整分隔位置；手柄对屏幕阅读器完全不存在（WCAG 2.1.1）。

      任务：把 Svelte 端已有的语义补到三端：
      - Splitter separator：方向键调整大小（步长沿用现有 props，Home/End 到
        极值），`aria-valuenow/min/max` 与 `role="separator"` +
        `aria-orientation`，名称走 i18n（`splitter.resize` 或同类 key）；
      - Resizable 手柄：改成可聚焦元素（`<button type="button">` 或等价），
        带 `aria-label`（i18n `resizer.handle`）、方向键移动、Esc 取消本次拖动；
      - 若需要新增 i18n key，必须同步补 `plugin-locale-zh` 中文（有回归守着）；
      - 鼠标行为、数值语义、现有 DOM 钩子保持不变。

      补测试：三端各两条（Splitter 键盘调整、Resizable 手柄键盘移动 + 有名称）。
      完成标准：react/vue/solid 相关测试全绿、typecheck 无错、
      `pnpm check:parity` 不回退。
