  # ── 4. 子菜单的 RTL 定位与键盘方向 ───────────────────────────────────
  - prompt: |
      硬约束：只改本任务点名的文件；不要新建脚本或改 ai-dev/**、docs/**、
      scripts/**、CI 配置；不要设计额外工作流；最终回复里给总结，不要自己写文件。

      你是 iris-ui 的四适配器维护者。仓库根 = 当前目录，先读 AGENTS.md。

      缺陷（已核实）：子菜单一律按 LTR 处理——
      定位写死 `placement: 'right-start'`（react `MenuSub.tsx:55`、
      vue `MenuSub.ts:106`、solid `IrisMenuSub.tsx:28`、
      svelte `IrisMenuSub.svelte:52`），键盘也写死 ArrowRight 打开 /
      ArrowLeft 关闭，箭头图标方向同样是物理的。
      后果：`dir="rtl"` 下子菜单从错误的一侧展开，键盘用户的“打开/关闭”方向键
      与视觉相反（这是键盘可达性缺陷，不只是视觉）。

      任务：让四端在 RTL 下把 placement、打开键、关闭键与箭头方向一起翻转：
      - 优先把“方向 → placement / 打开键 / 关闭键”的派生下沉到 core（或
        theme 里已有的方向 helper 旁）成为纯函数，四端共用；不要四端各写一份。
      - LTR 行为必须完全不变（现有测试不得回归）。
      - 补测试：四端各一条，RTL 下子菜单 placement 落在左侧、ArrowLeft 打开 /
        ArrowRight 关闭；LTR 断言保留。

      约束：只改 menu/submenu 相关文件 + 方向派生函数 + 测试；不动菜单定位算法
      （floating-ui）本身。完成标准：四端 menu 测试全绿、typecheck/svelte-check
      无错、`pnpm check:parity` 不回退。
    provider: openai-codex
    timeout: 5400
    validate: irischeck
    output: docs/auto/reviews/batch4-submenu-rtl.md

  # ── 5. Marquee 响应运行时的 prefers-reduced-motion 变化 ──────────────
  - prompt: |
      硬约束：只改本任务点名的文件；不要新建脚本或改 ai-dev/**、docs/**、
      scripts/**、CI 配置；不要设计额外工作流；最终回复里给总结，不要自己写文件。

      你是 iris-ui 的四适配器维护者。仓库根 = 当前目录，先读 AGENTS.md。

      缺陷（已核实）：Marquee 只在初始化时读一次
      `window.matchMedia('(prefers-reduced-motion: reduce)').matches`
      （react `Marquee.tsx:46-48`、vue `Marquee.ts:34-36`、
      solid `IrisMarquee.tsx:38-40`、svelte `IrisMarquee.svelte:37`），
      不订阅 `MediaQueryList.change`。后果：用户在系统里中途打开“减弱动效”，
      正在跑的滚动动画不会停下（prefers-reduced-motion 是一级无障碍要求）。

      任务：四端在挂载时订阅该 media query，变化时同步动画状态：
      - 变成 reduce → 停掉正在跑的 Web Animations / 定时器；
      - 变回 no-preference → 按原有条件恢复；
      - 卸载时必须取消订阅并清理（用 core 里既有的 disposable/生命周期设施，
        不要各端各写一套泄漏-prone 的 addEventListener）。
      - 优先把“订阅 + 回调”做成 core 的可复用 hook/helper（框架无关部分），
        四端只桥接响应式。

      约束：只改 marquee + 新增的共享订阅设施 + 测试；不要改动画时长/布局。
      补测试：四端各一条，挂载后切换 media query（jsdom 里 mock
      `matchMedia` 返回带 listener 的对象），断言动画状态随之改变。
      完成标准：四端 marquee 测试全绿、typecheck/svelte-check 无错。
    provider: openai-codex
    timeout: 5400
    validate: irischeck
    output: docs/auto/reviews/batch4-marquee-motion.md
