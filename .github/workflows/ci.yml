name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Manifest up-to-date
        run: pnpm check:manifest

      - name: Size budget
        run: pnpm size

      - name: Token audit
        run: pnpm audit:tokens

      - name: Test coverage report
        run: pnpm test:coverage

      - name: Core instrumented coverage (v8, real thresholds)
        run: pnpm turbo run test:coverage:v8 --filter=@iris-ui/core

      - name: Desktop OS parity
        run: pnpm check:desktop-parity

      - name: RSC directive
        run: pnpm check:rsc

      - name: Test
        run: pnpm test

      - name: Bench (advisory — not gate-failing)
        run: pnpm bench
        continue-on-error: true

      - name: Arch ratchet (no new oversized files / no growth of grandfathered)
        run: pnpm arch-check:ratchet

      - name: Arch full audit (advisory — lists all oversized files)
        run: pnpm arch-check
        continue-on-error: true

      - name: Change budget (advisory)
        run: pnpm change-budget
        continue-on-error: true
